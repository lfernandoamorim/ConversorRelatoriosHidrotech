<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidrotech - Conversor de Relatorios</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #222; }
        h2 { margin-bottom: 4px; }
        p.sub { color: #666; margin-top: 0; }
        form { border: 1px solid #ddd; border-radius: 8px; padding: 24px; }
        input[type="file"] { display: block; margin-bottom: 16px; width: 100%; }
        button { padding: 10px 18px; cursor: pointer; background: #007bff; color: #fff; border: none; border-radius: 4px; font-size: 15px; }
        button:hover { background: #0062cc; }
    </style>
</head>
<body>
    <h2>Extrair PDF para Excel</h2>
    <p class="sub">Envie o relatorio de medicao (PDF) e baixe a planilha formatada.</p>

    <!-- Formulario nativo. Sem JavaScript, sem Blobs, sem bloqueios do navegador.
         Action relativo para funcionar tanto em localhost quanto atras do dominio/Traefik. -->
    <form action="/api/extrair-tabela" method="POST" enctype="multipart/form-data">
        <input type="file" name="arquivo" accept="application/pdf" required>
        <button type="submit">Converter e Baixar</button>
    </form>
</body>
</html>
